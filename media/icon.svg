<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a2b33"/>
      <stop offset="1" stop-color="#121317"/>
    </linearGradient>
    <!-- dégradé en coordonnées absolues : les formes du nuage partagent la même teinte -->
    <linearGradient id="acc" gradientUnits="userSpaceOnUse" x1="150" y1="96" x2="420" y2="270">
      <stop offset="0" stop-color="#ffb84d"/>
      <stop offset="1" stop-color="#f0782a"/>
    </linearGradient>
    <linearGradient id="card" gradientUnits="userSpaceOnUse" x1="0" y1="226" x2="0" y2="410">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#e9e9ee"/>
    </linearGradient>
  </defs>
  <!-- fond, identique à la famille Agent* -->
  <rect x="16" y="16" width="480" height="480" rx="108" fill="url(#bg)"/>
  <rect x="16.5" y="16.5" width="479" height="479" rx="107.5" fill="none" stroke="#ffffff" stroke-opacity="0.09"/>
  <!-- le nuage où tournent les agents, en arrière -->
  <g fill="url(#acc)">
    <circle cx="232" cy="190" r="58"/>
    <circle cx="316" cy="160" r="72"/>
    <circle cx="384" cy="204" r="48"/>
    <rect x="174" y="190" width="258" height="62" rx="31"/>
  </g>
  <!-- la session au premier plan : avatar de l'agent, titre, puis une ligne d'état -->
  <rect x="80" y="226" width="300" height="184" rx="40" fill="url(#card)"/>
  <circle cx="148" cy="296" r="34" fill="#1b1c21"/>
  <rect x="202" y="270" width="132" height="20" rx="10" fill="#1b1c21"/>
  <rect x="202" y="306" width="82" height="16" rx="8" fill="#1b1c21" fill-opacity="0.32"/>
  <!-- session en cours : pastille ambre et barre de progression -->
  <circle cx="134" cy="364" r="11" fill="url(#acc)"/>
  <rect x="160" y="356" width="174" height="16" rx="8" fill="#1b1c21" fill-opacity="0.14"/>
  <rect x="160" y="356" width="104" height="16" rx="8" fill="#1b1c21"/>
</svg>
